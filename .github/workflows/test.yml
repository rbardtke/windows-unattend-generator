name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          for f in js/*.js; do node --check "$f"; done
          python3 -m py_compile scripts/*.py
      - name: Generated output matches the schneegans.de reference file
        run: node test/run.mjs
      - name: Every option switched on still generates
        run: node test/smoke.mjs /tmp/smoke-output.xml
