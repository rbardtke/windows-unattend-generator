name: Winget index

# Weekly: rebuild data/winget-index.json from the official winget source package and commit it,
# so the Software tab searches an up-to-date catalog. Pages redeploys on the push.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the index
        run: python3 scripts/build-winget-index.py data/winget-index.json
      - name: Commit when it changed
        run: |
          git config user.name "winget-index"
          git config user.email "winget-index@users.noreply.github.com"
          git add data/winget-index.json
          if git diff --cached --quiet; then
            echo "index unchanged"
          else
            git commit -m "Update winget index ($(date -u +%Y-%m-%d))"
            git push
          fi
